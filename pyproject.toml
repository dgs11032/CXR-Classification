[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p1-cxr"
version = "0.1.0"
description = "Hierarchical and supervised contrastive learning for three-class CXR pneumonia classification"
requires-python = "==3.12.*"
dependencies = [
  "certifi==2026.7.22",
  "matplotlib==3.11.1",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "Pillow==11.3.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
