version: 1
experiment: e1
status: supervised_contrastive_pneumonia_subtype_configuration
data_config: configs/data_config.yaml
output_dir: artifacts/experiments/e1

model:
  architecture: flat_with_projection
  backbone: convnext_tiny
  weights: IMAGENET1K_V1
  pretrained: true
  allow_weight_download: false
  feature_dimension: 768
  num_classes: 3
  classification_head: Linear(768, 3)
  projection_head: Linear(768, 256) -> ReLU -> Linear(256, 128) -> L2Normalization
  projection_hidden_dimension: 256
  projection_dimension: 128
  trainable_scope: full

loss:
  classification:
    name: CrossEntropyLoss
    label_smoothing: 0.0
    class_weighting: none_unweighted_e0_baseline
  supervised_contrastive:
    name: SupervisedContrastiveLoss
    temperature: 0.07
    lambda_supcon: 0.1
    included_labels: [1, 2]
    excluded_label: 0
    zero_loss_when_no_valid_positive_pairs: true

optimizer:
  name: AdamW
  strategy: differential_lr
  backbone_learning_rate: 0.00001
  head_learning_rate: 0.0001
  weight_decay: 0.0001

scheduler:
  name: CosineAnnealingLR
  t_max: 15
  eta_min: 0.000001

training:
  seed: 42
  epochs: 15
  early_stopping_patience: 5
  selection_metric: macro_f1
  device: cuda
  precision: fp32
  amp: false
  gradient_clip_norm: 1.0
  detect_nonfinite: true
  checkpoint:
    best_filename: best.pt
    last_filename: last.pt
    save_rng_state: true

smoke_test:
  device: auto
  train_batches: 1
  validation_samples_per_class: 2
  write_artifacts: false
