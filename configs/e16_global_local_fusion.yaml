version: 1
experiment: e16
status: frozen_e15_global_local_dual_view_fusion
data_config: configs/data_config.yaml
output_dir: artifacts/experiments/e16

model:
  hf_model_id: microsoft/rad-dino
  revision: main
  trust_remote_code: false
  required_transformers_version: 4.57.6
  expected_hidden_size: 768
  expected_num_hidden_layers: 12
  patch_size: 14
  expected_image_size: 518
  spatial_pool_grid: [4, 4]
  e15_restore: base_rad_dino_plus_final_last_block_and_head
  encoder_trainable: false
  e15_head_trainable: false

head:
  architecture: cls_plus_4x4_patch_attention_pooling_binary_head
  attention_hidden_dimension: 128
  classifier_hidden_dimension: 256
  dropout: 0.1
  num_classes: 2

roi:
  method: conservative_foreground_bounds_no_segmentation
  foreground_threshold: 5
  expansion_fraction: 0.02
  minimum_width_fraction: 0.78
  minimum_height_fraction: 0.78
  minimum_area_fraction: 0.60
  fallback: original_image
  quality_contact_sheet_train_only: true
  contact_sheet_samples_per_class: 4
  seed: 42

features:
  kind: cls_plus_frozen_e15_binary_logits
  dimension_per_view: 770
  cache_dtype: float16

fusion_head:
  architecture: concat_global_local_layernorm_mlp
  hidden_dimension: 256
  dropout: 0.1
  num_classes: 2

runtime:
  device: cuda
  feature_batch_size: 1
  fusion_batch_size: 64
  num_workers: 0
  pin_memory: true
  amp: true

training:
  seed: 42
  fixed_epochs: 5
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  checkpoint_policy: final_epoch_only
  internal_holdout: disabled
  early_stopping: false
  validation_weight_selection: false
  validation_threshold_selection: false

split_contract:
  train_manifest: artifacts/splits/train_manifest.csv
  validation_manifest: artifacts/splits/val_manifest.csv
  binary_class_order: [BACTERIAL_PNEUMONIA, VIRAL_PNEUMONIA]
  canonical_to_binary: {1: 0, 2: 1}
  expected_counts:
    train: {BACTERIAL_PNEUMONIA: 2153, VIRAL_PNEUMONIA: 1147, total: 3300}
    validation: {NORMAL: 192, BACTERIAL_PNEUMONIA: 359, VIRAL_PNEUMONIA: 191, total: 742}
  no_test_access: true

e15_initialization:
  final_checkpoint: artifacts/experiments/e15/final.pt
  predictions: artifacts/experiments/e15/validation_predictions.csv
  metrics: artifacts/experiments/e15/validation_metrics.json

e10_routing_input:
  predictions: artifacts/experiments/e10/hierarchical_predictions.csv
  normal_rule: e6_pred_zero_kept_else_e16_binary_plus_one
  expected_e10_macro_f1: 0.830878

artifacts:
  cache_dir: dual_view_feature_cache
  train_global: train_bv_global_features.npz
  train_local: train_bv_local_features.npz
  validation_global: validation_global_features.npz
  validation_local: validation_local_features.npz
  train_index: train_bv_index.csv
  validation_index: validation_index.csv
  cache_metadata: cache_metadata.json
  roi_quality: roi_quality_train.csv
  roi_contact_sheet: roi_quality_train_contact_sheet.png
  final_checkpoint: final_fusion_head.pt
  history: train_history.json
  metrics: validation_metrics.json
  predictions: validation_predictions.csv
  run_metadata: run_metadata.json

smoke_test:
  samples_per_class: 1
