version: 1
seed: 42

manifests:
  train: artifacts/splits/train_manifest.csv
  validation: artifacts/splits/val_manifest.csv

class_mapping:
  NORMAL: 0
  BACTERIAL_PNEUMONIA: 1
  VIRAL_PNEUMONIA: 2

transform:
  image_size: [224, 224]
  channel_policy: grayscale_then_rgb3
  resize: direct
  interpolation: bilinear
  antialias: true
  normalization:
    source: torchvision.models.ConvNeXt_Tiny_Weights.IMAGENET1K_V1
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    rotation:
      enabled: true
      degrees: 5.0
      probability: 0.5
      fill: 0
    brightness_contrast:
      enabled: true
      brightness: 0.10
      contrast: 0.10
      probability: 0.5
    horizontal_flip: false
    random_crop: false
    scale_jitter: false

views:
  train: two
  validation: single

loader:
  batch_size: 16
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  drop_last: false
  train_shuffle: true
  validation_shuffle: false
